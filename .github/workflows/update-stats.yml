name: Update written GitHub profile statistics

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:17 UTC (08:17 in Pakistan Standard Time).
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the statistics script
        run: python -m unittest discover -s tests -v

      - name: Refresh the written statistics
        env:
          GITHUB_USERNAME: sabirhusseinbalal
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
        run: python scripts/update_stats.py

      - name: Save the refreshed profile README
        run: |
          if git diff --quiet -- README.md; then
            echo "Statistics are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh written GitHub profile statistics"
          git push
