name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:17 UTC (08:17 in Pakistan Standard Time).
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate the statistics card
        env:
          GITHUB_USERNAME: sabirhusseinbalal
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          # Keep false while the native GitHub Follow button is hidden.
          SHOW_FOLLOWERS: "false"
        run: python scripts/update_stats.py

      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/profile-stats.svg; then
            echo "Statistics card is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg
          git commit -m "chore: update GitHub profile stats"
          git push
